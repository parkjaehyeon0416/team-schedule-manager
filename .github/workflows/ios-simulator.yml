# ★ v18.46 — 맥 없이 아이폰 테스트: GitHub 맥 서버에서 iOS 시뮬레이터용으로 빌드 → 가상 아이폰에서 실행 →
#   화면 캡처·로그를 ios-test-results 브랜치에 올림(애플 개발자 등록·서명 불필요).
#   실행: ios-build 브랜치에 push 하거나 Actions 탭에서 수동 실행.
name: iOS Simulator Test

on:
  push:
    branches: [ios-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: app

      # 실패 원인을 결과 브랜치에서 볼 수 있게 각 단계 출력을 ios-results에 남김
      - name: Install JS packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ios-results"
          npm ci > "$GITHUB_WORKSPACE/ios-results/npm.log" 2>&1 || { tail -80 "$GITHUB_WORKSPACE/ios-results/npm.log"; exit 1; }

      - name: Tool versions
        run: (xcodebuild -version && node -v && npm -v && xcrun simctl list runtimes) | tee "$GITHUB_WORKSPACE/ios-results/versions.txt"

      - name: Install pods
        run: cd ios && (bundle exec pod install > "$GITHUB_WORKSPACE/ios-results/pod.log" 2>&1 || { tail -80 "$GITHUB_WORKSPACE/ios-results/pod.log"; exit 1; })

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -workspace ios/app.xcworkspace -scheme app -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:|fatal" build.log | head -60; tail -80 build.log; exit 1; }
          tail -5 build.log

      - name: Run in simulator
        run: |
          mkdir -p ../ios-results
          APP=$(find ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print([x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')][-1])")
          echo "DEV=$DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch "$DEV" com.workmate.app
          sleep 30
          xcrun simctl io "$DEV" screenshot ../ios-results/01_launch.png
          # 초대 링크로 앱 열기(workmate:// 스킴 확인)
          xcrun simctl openurl "$DEV" "workmate://join/6NXTAX" || true
          sleep 10
          xcrun simctl io "$DEV" screenshot ../ios-results/02_deeplink.png
          xcrun simctl spawn "$DEV" launchctl list | grep -i workmate > ../ios-results/running.txt || echo "NOT RUNNING (crashed?)" > ../ios-results/running.txt
          xcrun simctl spawn "$DEV" log show --last 5m --style compact --predicate 'process == "app"' > ../ios-results/app.log 2>&1 || true
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i app > ../ios-results/crashes.txt || echo "no crash reports" > ../ios-results/crashes.txt
          # Appetize 등에 올릴 수 있는 시뮬레이터 앱 묶음
          (cd "$(dirname "$APP")" && zip -qry "$GITHUB_WORKSPACE/ios-results/WorkMate-simulator.zip" "$(basename "$APP")")
          ls -la ../ios-results

      - name: Publish results
        if: always()
        working-directory: .
        run: |
          mkdir -p ios-results
          [ -f ios-results/npm.log ] && tail -150 ios-results/npm.log > ios-results/npm-tail.txt && rm ios-results/npm.log
          [ -f ios-results/pod.log ] && tail -200 ios-results/pod.log > ios-results/pod-tail.txt && rm ios-results/pod.log
          cp app/build.log ios-results/build.log 2>/dev/null || true
          if [ -f ios-results/build.log ]; then grep -E "error:|fatal" ios-results/build.log | head -100 > ios-results/build-errors.txt || true; tail -150 ios-results/build.log > ios-results/build-tail.txt; rm ios-results/build.log; fi
          echo "${{ github.sha }} ${{ job.status }} $(date -u)" > ios-results/RUN.txt
          cd ios-results
          git init -q && git checkout -q -b ios-test-results
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "iOS simulator results for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ios-test-results
