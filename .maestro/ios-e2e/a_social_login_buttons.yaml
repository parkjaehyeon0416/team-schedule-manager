# (a) 로그인 화면 — 카카오 / 구글 / Apple 버튼을 하나씩 눌러 뜨는 화면을 캡처하고 바로 취소(로그인은 하지 않음, 아무것도 입력하지 않음)
appId: com.workmatekr.app
name: a_social_login_buttons
---
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: "아이디 찾기"
    timeout: 90000
- takeScreenshot: a_01_login_screen

# ── 카카오: 카카오톡이 없는 시뮬레이터 → 시스템 확인 창("kakao.com 사용") → [Continue]면 카카오 웹 로그인 화면 ──
- tapOn: "카카오로 로그인"
- extendedWaitUntil:
    visible: ".*kakao\\.com.*"
    timeout: 20000
    optional: true
- takeScreenshot: a_02_kakao_system_prompt
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - extendedWaitUntil:
          visible: ".*카카오계정.*|.*Kakao Account.*|.*kakaocorp.*|.*QR.*"
          timeout: 20000
          optional: true
      - takeScreenshot: a_03_kakao_web_login
- tapOn:
    text: "Cancel|Close|취소|닫기"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: a_04_after_kakao_cancel
# 취소가 오류 알림으로 보이면(앱 버그 후보) 캡처 후 닫기
- runFlow:
    when:
      visible: "로그인 실패"
    commands:
      - takeScreenshot: a_04b_kakao_cancel_alert
      - tapOn: "확인"

# ── 구글: 시스템 확인 창("google.com 사용") → [Continue]면 구글 로그인 웹 화면 ──
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "구글로 로그인"
    timeout: 60000
- tapOn: "구글로 로그인"
- extendedWaitUntil:
    visible: ".*google\\.com.*"
    timeout: 20000
    optional: true
- takeScreenshot: a_05_google_system_prompt
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - extendedWaitUntil:
          visible: ".*Sign in.*|.*로그인.*with Google.*|.*Google 계정.*|.*Email or phone.*|.*이메일 또는 휴대전화.*"
          timeout: 20000
          optional: true
      - takeScreenshot: a_06_google_web_login
- tapOn:
    text: "Cancel|Close|취소|닫기"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: a_07_after_google_cancel
- runFlow:
    when:
      visible: "로그인 실패"
    commands:
      - takeScreenshot: a_07b_google_cancel_alert
      - tapOn: "확인"

# ── Apple: 서명 없는 시뮬레이터 빌드라 애플 시트 또는 실패 알림이 떠야 정상(앱이 꺼지면 안 됨) ──
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Apple로 로그인"
    timeout: 60000
- tapOn: "Apple로 로그인"
- extendedWaitUntil:
    visible: "로그인 실패|.*Apple.*ID.*|.*Apple Account.*|Settings|설정"
    timeout: 15000
    optional: true
- takeScreenshot: a_08_apple_sheet
- tapOn:
    text: "확인|Cancel|Close|취소|닫기|Not Now"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: a_09_after_apple_close
- assertVisible: "Apple로 로그인"
