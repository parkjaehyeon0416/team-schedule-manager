# (e) 로그인 화면 → 이메일로 회원가입 → 휴대폰 문자 인증(인증번호는 로컬 백엔드 로그에서 읽음) → 확인됨 → 가입 완료
#   가상 번호(SIGNUP_PHONE)·가상 이메일·무작위 비밀번호만 씀. 로컬 백엔드는 SMS_DRIVER=log라 실제 문자는 안 나감
appId: com.workmatekr.app
name: e_signup_phone_verify
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "아이디 찾기"
    timeout: 60000
- tapOn: "이메일로 회원가입"
- extendedWaitUntil:
    visible: "기본정보 입력"
    timeout: 20000
- takeScreenshot: e_01_signup_form

- tapOn: "이름"
- runFlow: common/system-dialogs.yaml
- inputText: "E2E Signup"
- tapOn: "이메일"
- inputText: ${SIGNUP_EMAIL}
- tapOn: "비밀번호"
- inputText: ${SIGNUP_PW}
- tapOn: "비밀번호 확인"
- inputText: ${SIGNUP_PW}
- tapOn: "휴대폰 번호"
- inputText: ${SIGNUP_PHONE}
- takeScreenshot: e_02_phone_entered

# 인증번호 받기 → 인증번호 칸 + 남은 시간
- tapOn: "인증번호 받기"
- extendedWaitUntil:
    visible: "다시 받기"
    timeout: 20000
- takeScreenshot: e_03_code_sent

# 로컬 백엔드 로그에 남은 6자리를 받아 입력 → 확인
- runScript:
    file: scripts/get_code.js
    env:
      PHONE: ${SIGNUP_PHONE}
- tapOn: "인증번호"
- inputText: ${output.code}
- takeScreenshot: e_04_code_typed
- tapOn: "확인"
- extendedWaitUntil:
    visible: "휴대폰 인증을 완료했어요"
    timeout: 20000
- takeScreenshot: e_05_phone_verified
- assertVisible: "확인됨"

# 약관 동의(줄 왼쪽 체크 상자 — 가운데를 누르면 약관 링크가 열림) → 가입하기
- scrollUntilVisible:
    element: "이용약관 및.*"
    direction: DOWN
    timeout: 10000
- tapOn:
    text: "이용약관 및.*"
    point: "3%,50%"
- scrollUntilVisible:
    element: "가입하기"
    direction: DOWN
    timeout: 10000
- takeScreenshot: e_06_terms_checked
- tapOn: "가입하기"
- extendedWaitUntil:
    visible: "팀관리|Allow|회원가입 실패|오류"
    timeout: 40000
- takeScreenshot: e_07_after_signup
- runFlow: common/system-dialogs.yaml
- extendedWaitUntil:
    visible: "팀관리"
    timeout: 20000
- takeScreenshot: e_08_signup_home
