<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <style>html,body{margin:0;padding:0;height:100%;}</style>
</head>
<body>
  <div id="wrap" style="width:100%;height:100%;"></div>
  <script>
    window.onerror = function(msg, url, line, col, error) {
      try {
        window.ReactNativeWebView.postMessage(JSON.stringify({ __debug: true, msg: String(msg), line: line }));
      } catch (e) {}
      return false;
    };
    try {
      new daum.Postcode({
        oncomplete: function(data) {
          try {
            window.ReactNativeWebView.postMessage(JSON.stringify({
              zonecode: data.zonecode,
              roadAddress: data.roadAddress,
              jibunAddress: data.jibunAddress,
              buildingName: data.buildingName,
              bname: data.bname,
            }));
          } catch (e) {
            window.ReactNativeWebView.postMessage(JSON.stringify({ __debug: true, msg: 'postMessage failed: ' + e.message }));
          }
        },
        width: '100%',
        height: '100%',
      }).embed(document.getElementById('wrap'));
    } catch (e) {
      window.ReactNativeWebView.postMessage(JSON.stringify({ __debug: true, msg: 'init failed: ' + e.message }));
    }
  </script>
</body>
</html>
